name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar el proyecto
        run: |
          buscar() { find . -name settings.gradle.kts -not -path './.git/*' | head -1; }
          if [ -z "$(buscar)" ]; then
            for z in $(find . -name '*.zip' -not -path './.git/*'); do unzip -o -q "$z" -d _descomprimido; done
          fi
          S="$(buscar)"
          if [ -z "$S" ]; then
            echo "::error::No encuentro settings.gradle.kts. Sube el contenido de la carpeta CMJLab-Android."
            find . -not -path './.git*' | head -100
            exit 1
          fi
          echo "Proyecto encontrado en: $(dirname "$S")"
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Renombrar APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" CMJLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CMJLab-apk
          path: CMJLab.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CMJ Lab v${{ github.run_number }}
          files: CMJLab.apk
          make_latest: true
